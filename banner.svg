<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 155" width="900" height="155">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1F2A" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="flowWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#334155" opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="155" rx="10" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="900" height="155" rx="10" fill="url(#grid)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="28" width="4" height="99" rx="2" fill="url(#accent)" />

  <!-- Subtle Left-to-Right Guiding Wave Along Bottom Edge -->
  <path d="M 0 135 C 220 95, 480 155, 900 115" fill="none" stroke="url(#flowWave)" stroke-width="2" filter="url(#glow)" />

  <!-- LEFT-SIDE ANIMATED BIO-OMICS EMBLEM -->
  <g transform="translate(26, 26)">
    <g stroke="#1E293B" stroke-width="1.3">
      <line x1="20" y1="25" x2="55" y2="12" />
      <line x1="55" y1="12" x2="88" y2="32" />
      <line x1="20" y1="25" x2="32" y2="65" />
      <line x1="32" y1="65" x2="72" y2="78" />
      <line x1="88" y1="32" x2="72" y2="78" />
      <line x1="55" y1="12" x2="52" y2="48" />
      <line x1="20" y1="25" x2="52" y2="48" />
      <line x1="88" y1="32" x2="52" y2="48" />
      <line x1="32" y1="65" x2="52" y2="48" />
      <line x1="72" y1="78" x2="52" y2="48" />
    </g>

    <g stroke="url(#accent)" stroke-width="1.5" opacity="0.8">
      <line x1="20" y1="25" x2="52" y2="48" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.6s" repeatCount="indefinite" />
      </line>
      <line x1="52" y1="48" x2="88" y2="32" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.6s" repeatCount="indefinite" />
      </line>
      <line x1="32" y1="65" x2="72" y2="78" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.6s" repeatCount="indefinite" />
      </line>
    </g>

    <circle cx="20" cy="25" r="3.8" fill="#00F2FE" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="55" cy="12" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="52" cy="48" r="5" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="32" cy="65" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="88" cy="32" r="4.5" fill="#00F2FE" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="72" cy="78" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite" />
    </circle>

    <g transform="translate(36, 86)" opacity="0.85">
      <rect x="0" y="4" width="3.5" height="14" rx="1.5" fill="#00F2FE">
        <animate attributeName="height" values="8;18;8" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="9;4;9" dur="1.8s" repeatCount="indefinite" />
      </rect>
      <rect x="8" y="2" width="3.5" height="18" rx="1.5" fill="#10B981">
        <animate attributeName="height" values="18;8;18" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="4;9;4" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="16" y="5" width="3.5" height="12" rx="1.5" fill="#38BDF8">
        <animate attributeName="height" values="10;20;10" dur="2.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="8;3;8" dur="2.1s" repeatCount="indefinite" />
      </rect>
      <rect x="24" y="3" width="3.5" height="15" rx="1.5" fill="#0EA5E9">
        <animate attributeName="height" values="16;7;16" dur="1.7s" repeatCount="indefinite" />
        <animate attributeName="y" values="5;10;5" dur="1.7s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- TEXT BLOCK -->
  <g transform="translate(142, 0)">
    <text x="0" y="56" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#F8FAFC" letter-spacing="0.4">Ritu Shah</text>
    
    <rect x="162" y="37" width="82" height="22" rx="6" fill="#064E3B" fill-opacity="0.35" stroke="#059669" stroke-width="0.8" />
    <text x="174" y="52" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#10B981" letter-spacing="0.5">NHPC #164</text>

    <text x="0" y="89" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#38BDF8" letter-spacing="0.25">
      Medical Microbiologist  |  Bioinformatician  |  Clinical Researcher
    </text>

    <text x="0" y="118" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#CBD5E1" letter-spacing="0.2">
      Infectious Disease  •  Immunology + Cell Biology  •  Host–Microbiome Interactions  •  AMR Surveillance
    </text>
  </g>
</svg>
